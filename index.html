<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таємниця старої мапи</title>

<style>
:root{
  --ink:#1d332e;
  --muted:#62736f;
  --accent:#0d756d;
  --paper:rgba(255,255,255,.985);
  --shadow:rgba(18,42,48,.20);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:#eef7f8;
}

button{
  font:inherit;
}

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-rows:minmax(0,1fr) 56px;
  place-items:center;
  padding:6px 10px 4px;
}

/* КНИЖКОВА ОСНОВА */

.book{
  position:relative;

  width:min(
    96vw,
    calc((100dvh - 70px) * 1.5)
  );

  max-width:1500px;
  max-height:calc(100dvh - 70px);

  aspect-ratio:3 / 2;

  perspective:2400px;
  isolation:isolate;
}

.book-base{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:fill;

  pointer-events:none;
  user-select:none;

  filter:
    drop-shadow(
      0 16px 28px var(--shadow)
    );

  z-index:1;
}

/* РЕАЛЬНІ ЗОНИ ЛІВОЇ ТА ПРАВОЇ СТОРІНКИ */

.page-zone{
  position:absolute;

  top:5.1%;
  height:89.2%;

  overflow:hidden;

  z-index:4;
}

.page-left{
  left:5.1%;
  width:42.7%;
}

.page-right{
  left:52.2%;
  width:42.7%;
}

.page{
  width:100%;
  height:100%;

  position:relative;

  overflow:hidden;

  background:transparent;
}

/* ТЕКСТ + ІЛЮСТРАЦІЯ */

.page.pad{
  padding:5.4% 6.8% 5.2%;

  display:flex;
  flex-direction:column;
}

.title{
  margin:0 0 3.7%;

  color:var(--accent);

  font-size:
    clamp(23px,2vw,35px);

  line-height:1.05;

  font-weight:850;
}

.text{
  font-size:
    clamp(15px,1.2vw,20px);

  line-height:1.53;

  letter-spacing:.002em;
}

.text p{
  margin:0 0 .86em;
}

.text p:last-child{
  margin-bottom:0;
}

.dialogue{
  font-weight:620;
  color:#2d4b45;
}

.inset{
  margin:auto 0 0;

  width:100%;
  height:40%;

  overflow:hidden;

  border-radius:10px;

  box-shadow:
    0 8px 18px
    rgba(22,48,45,.10);
}

.inset.tall{
  height:47%;
}

.inset.short{
  height:34%;
}

.inset img,
.full img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.inset img{
  object-position:center 38%;
}

/* ВЕЛИКА ІЛЮСТРАЦІЯ */

.full{
  width:100%;
  height:100%;

  margin:0;

  overflow:hidden;

  position:relative;
}

.full img{
  object-position:center;
}

.full .caption{
  position:absolute;

  left:6%;
  right:6%;
  bottom:5.5%;

  padding:10px 14px;

  border-radius:12px;

  background:
    rgba(255,255,255,.88);

  backdrop-filter:blur(3px);

  font-size:
    clamp(13px,1vw,17px);

  line-height:1.38;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.08);
}

/* ТЕКСТ + КАДР У МЕЖАХ ОДНІЄЇ СТОРІНКИ */

.split{
  height:100%;

  padding:4.9% 6.5%;

  display:grid;

  grid-template-rows:
    1fr 43%;

  gap:4%;
}

.split.reverse{
  grid-template-rows:
    45% 1fr;
}

.split .imagebox{
  overflow:hidden;

  border-radius:10px;

  box-shadow:
    0 8px 18px
    rgba(22,48,45,.10);
}

.split .imagebox img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.split .copy{
  font-size:
    clamp(15px,1.17vw,19.5px);

  line-height:1.52;

  overflow:hidden;
}

.split .copy p{
  margin:0 0 .82em;
}

.split .copy p:last-child{
  margin-bottom:0;
}

/* НОМЕРИ СТОРІНОК */

.page-num{
  position:absolute;

  bottom:2.1%;

  font-size:
    clamp(10px,.72vw,12px);

  color:#84928f;
}

.page-left .page-num{
  left:7%;
}

.page-right .page-num{
  right:7%;
}

/* ПИТАННЯ ВІД ГЕРОЇВ */

.questions{
  height:100%;

  padding:5.3% 6.8%;

  display:flex;
  flex-direction:column;
}

.questions-hero{
  width:100%;
  height:33%;

  margin:0 0 3.5%;

  overflow:hidden;

  border-radius:10px;

  box-shadow:
    0 7px 16px
    rgba(22,48,45,.10);
}

.questions-hero img{
  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center 38%;

  display:block;
}

.questions h2{
  margin:0 0 3%;

  color:var(--accent);

  font-size:
    clamp(21px,1.75vw,31px);

  line-height:1.08;
}

.questions .intro{
  margin:0 0 4%;

  color:var(--muted);

  font-size:
    clamp(14px,1vw,17px);

  line-height:1.42;
}

.questions ol{
  margin:0;

  padding-left:1.3em;

  display:grid;

  gap:.55em;

  font-size:
    clamp(13px,.98vw,16.5px);

  line-height:1.38;
}

.questions li::marker{
  color:var(--accent);
  font-weight:800;
}

/* АРКУШ, ЯКИЙ ГОРТАЄТЬСЯ */

.flip-sheet{
  position:absolute;

  top:5.1%;

  height:89.2%;
  width:42.7%;

  opacity:0;

  pointer-events:none;

  transform-style:preserve-3d;

  z-index:30;
}

.flip-sheet.next{
  left:52.2%;
  transform-origin:left center;
}

.flip-sheet.prev{
  left:5.1%;
  transform-origin:right center;
}

.face{
  position:absolute;
  inset:0;

  overflow:hidden;

  backface-visibility:hidden;

  background:
    rgba(255,255,255,.965);

  box-shadow:
    0 6px 22px
      rgba(20,42,48,.16),
    inset 0 0 24px
      rgba(20,42,48,.035);
}

.face.back{
  transform:rotateY(180deg);
}

.flip-sheet.turn-next{
  opacity:1;

  animation:
    turnNext
    980ms
    cubic-bezier(.28,.06,.18,.99)
    forwards;
}

.flip-sheet.turn-prev{
  opacity:1;

  animation:
    turnPrev
    980ms
    cubic-bezier(.28,.06,.18,.99)
    forwards;
}

@keyframes turnNext{

  0%{
    transform:rotateY(0deg);
    filter:brightness(1);
  }

  47%{
    filter:brightness(.88);
  }

  100%{
    transform:rotateY(-180deg);
    filter:brightness(1);
  }
}

@keyframes turnPrev{

  0%{
    transform:rotateY(0deg);
    filter:brightness(1);
  }

  47%{
    filter:brightness(.88);
  }

  100%{
    transform:rotateY(180deg);
    filter:brightness(1);
  }
}

/* КЕРУВАННЯ */

.controls{
  height:56px;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:14px;
}

.controls button{
  border:0;

  border-radius:999px;

  padding:10px 17px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #19a89d,
      #0a7169
    );

  font-weight:750;

  cursor:pointer;

  box-shadow:
    0 7px 17px
    rgba(10,110,102,.16);
}

.controls button:disabled{
  opacity:.32;
  cursor:default;
}

.counter{
  min-width:72px;

  text-align:center;

  color:var(--muted);

  font-size:14px;
  font-weight:750;
}

/* МОБІЛЬНИЙ ЕКРАН */

@media(max-width:760px){

  .app{
    grid-template-rows:
      minmax(0,1fr)
      50px;

    padding:4px;
  }

  .book{
    width:min(
      98vw,
      calc((100dvh - 58px) * 1.5)
    );

    max-height:
      calc(100dvh - 58px);
  }

  .text,
  .split .copy{
    font-size:
      clamp(9px,1.85vw,13px);

    line-height:1.43;
  }

  .title{
    font-size:
      clamp(14px,3vw,20px);
  }

  .questions ol{
    font-size:
      clamp(8px,1.65vw,12px);
  }

  .questions .intro{
    font-size:
      clamp(8px,1.7vw,12px);
  }

  .questions h2{
    font-size:
      clamp(13px,2.8vw,19px);
  }

  .controls{
    height:50px;
    gap:8px;
  }

  .controls button{
    padding:8px 12px;
    font-size:13px;
  }

  .counter{
    min-width:58px;
    font-size:12px;
  }
}

</style>
</head>

<body>

<div class="app">

  <section
    class="book"
    id="book"
  >

    <img
      id="bookBase"
      class="book-base"
      src="assets/images/00_book_start.png"
      alt=""
    >

    <div
      id="leftPage"
      class="page-zone page-left"
    ></div>

    <div
      id="rightPage"
      class="page-zone page-right"
    ></div>

    <div
      id="flipNext"
      class="flip-sheet next"
    >
      <div
        id="nextFront"
        class="face front"
      ></div>

      <div
        id="nextBack"
        class="face back"
      ></div>
    </div>

    <div
      id="flipPrev"
      class="flip-sheet prev"
    >
      <div
        id="prevFront"
        class="face front"
      ></div>

      <div
        id="prevBack"
        class="face back"
      ></div>
    </div>

  </section>

  <nav class="controls">

    <button
      id="prevBtn"
      type="button"
    >
      ← Назад
    </button>

    <span
      id="counter"
      class="counter"
    >
      1 / 7
    </span>

    <button
      id="nextBtn"
      type="button"
    >
      Далі →
    </button>

  </nav>

</div>

<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const BASE_START =
      "assets/images/00_book_start.png";

    const BASE_SPREAD =
      "assets/images/01_book_spread.png";


    const img = (
      src,
      alt = ""
    ) =>
      `<img
        src="${src}"
        alt="${alt}"
        onerror="this.style.display='none'"
      >`;


    const num = n =>
      `<span class="page-num">
        ${n}
      </span>`;


    const pages = {

      p1: `
      <article class="page pad">

        <h1 class="title">
          Таємниця старої мапи
        </h1>

        <div class="text">

          <p>
            Одного сонячного дня
            Сашко й Дмитро гуляли
            біля річки.
            Під корінням старої верби
            Сашко помітив пожовклий згорток.
          </p>

          <p>
            Хлопці обережно розгорнули його —
            це була стара мапа.
            На ній виднілися річка

          <p class="dialogue">
            — Перевіримо,
            куди вона веде? —
            запропонував Дмитро.
          </p>

        </div>

        <figure class="inset tall">

          ${img(
            "05_scene_01_map_found.png",
            "Хлопці знайшли стару мапу"
          )}

        </figure>

        ${num(1)}

      </article>
      `,


      p2: `
      <article class="page pad">

        <div class="text">

          <p>
            Біля берега стояв дерев’яний човен.
            Друзі сіли в нього
            й попливли за маршрутом,
            позначеним на мапі.

          <p>
            Спочатку річка була

            Та невдовзі береги стали вищими,

          </p>

          </p>

        </div>

        <figure class="inset">

          ${img(
            "06_scene_02_boat_route.png",
            "Подорож човном"
          )}

        </figure>

        ${num(2)}

      </article>
      `,


      p3: `
      <article class="page full">

        ${img(
          "06_scene_02_boat_route.png",
          "Хлопці пливуть річкою"

        <div class="caption">
          Річка вела їх туди,

          інша частина пригоди.
        </div>

        ${num(3)}

      </article>
      `,


      p4: `
      <article class="page split">

        <div class="copy">

          <p>
            Незабаром хлопці пристали

        ${num(4)}

      </article>
      `,


      p5: `
      <article class="page full">

        ${img(
          "08_scene_04_old_oak.png",
          "Старий дуб"
        )}

        <div class="caption">
          Дуб ріс тут,

      `,


      p6: `

        </div>

        <div class="copy">

          <p>
            Та радість від знахідки
            швидко змінилася тривогою.

      p7: `

      </article>
      `,


      p8: `

      </article>

        ${img(

        )}

        <div class="caption">

        <h2>

      `
    };


    const spreads = [

      {
        left:null,
        right:"p1",
        base:BASE_START
      },

      {
        left:"p2",
        right:"p3",
        base:BASE_SPREAD
      },

      {
        left:"p4",
        right:"p5",
        base:BASE_SPREAD
      },

      {
        left:"p6",
        right:"p7",
        base:BASE_SPREAD
      },

      {
        left:"p8",
        right:"p9",
        base:BASE_SPREAD
      },

      {
        left:"p10",
        right:"p11",
        base:BASE_SPREAD
      },

      {
        left:"p12",
        right:"p14",
        base:BASE_SPREAD
      }

    ];


    const bookBase =
      document.getElementById("bookBase");

    const leftPage =
      document.getElementById("leftPage");

    const rightPage =
      document.getElementById("rightPage");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const counter =
      document.getElementById("counter");

    const flipNext =
      document.getElementById("flipNext");

    const nextFront =
      document.getElementById("nextFront");

    const nextBack =
      document.getElementById("nextBack");

    const flipPrev =
      document.getElementById("flipPrev");

    const prevFront =
      document.getElementById("prevFront");

    const prevBack =
      document.getElementById("prevBack");


    let current = 0;
    let busy = false;
    let pointerX = null;


    function html(id){

      return id
        ? (pages[id] || "")
        : "";

    }


    function updateButtons(){

      counter.textContent =
        `${current + 1} / ${spreads.length}`;

      prevBtn.disabled =
        busy || current === 0;

      nextBtn.disabled =
        busy ||
        current === spreads.length - 1;

    }


    function render(){

      const spread =
        spreads[current];

      bookBase.src =
        spread.base;

      leftPage.innerHTML =
        html(spread.left);

      rightPage.innerHTML =
        html(spread.right);

      updateButtons();

    }


    function resetFlip(){

      flipNext.className =
        "flip-sheet next";

      flipPrev.className =
        "flip-sheet prev";

      nextFront.innerHTML = "";
      nextBack.innerHTML = "";

      prevFront.innerHTML = "";
      prevBack.innerHTML = "";

    }


    function goNext(){

      if(
        busy ||
        current >= spreads.length - 1
      ){
        return;
      }

      busy = true;

      updateButtons();

      const currentSpread =
        spreads[current];

      const nextSpread =
        spreads[current + 1];

      nextFront.innerHTML =
        html(currentSpread.right);

      nextBack.innerHTML =
        html(nextSpread.left);

      rightPage.innerHTML =
        html(nextSpread.right);

      requestAnimationFrame(
        () => {

          flipNext
            .classList
            .add("turn-next");

        }
      );

      setTimeout(
        () => {

          bookBase.src =
            nextSpread.base;

        },
        430
      );

      setTimeout(
        () => {

          current++;

          resetFlip();

          busy = false;

          render();

        },
        1000
      );

    }


    function goPrev(){

      if(
        busy ||
        current <= 0
      ){
        return;
      }

      busy = true;

      updateButtons();

      const currentSpread =
        spreads[current];

      const previousSpread =
        spreads[current - 1];

      prevFront.innerHTML =
        html(currentSpread.left);

      prevBack.innerHTML =
        html(previousSpread.right);

      leftPage.innerHTML =
        html(previousSpread.left);

      requestAnimationFrame(
        () => {

          flipPrev
            .classList
            .add("turn-prev");

        }
      );

      setTimeout(
        () => {

          bookBase.src =
            previousSpread.base;

        },
        430
      );

      setTimeout(
        () => {

          current--;

          resetFlip();

          busy = false;

          render();

        },
        1000
      );

    }


    prevBtn.addEventListener(
      "click",
      goPrev
    );

    nextBtn.addEventListener(
      "click",
      goNext
    );


    window.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "ArrowRight"
        ){
          goNext();
        }

        if(
          event.key === "ArrowLeft"
        ){
          goPrev();
        }

      }
    );


    const book =
      document.getElementById("book");


    book.addEventListener(
      "pointerdown",
      event => {

        pointerX =
          event.clientX;

      }
    );


    book.addEventListener(
      "pointerup",
      event => {

        if(
          pointerX === null
        ){
          return;
        }

        const delta =
          event.clientX - pointerX;

        pointerX = null;

        if(
          Math.abs(delta) < 60
        ){
          return;
        }

        if(delta < 0){

          goNext();

        }else{

          goPrev();

        }

      }
    );


    render();

  }
);

</script>

</body>
</html>
