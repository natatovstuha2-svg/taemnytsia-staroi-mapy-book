<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таємниця старої мапи — книжковий прототип</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="app">
    <section class="book-shell" id="bookShell" aria-label="Інтерактивна книга">
      <img
        id="bookBase"
        class="book-base"
        src="assets/images/00_book_start.png"
        alt=""
        aria-hidden="true"
      >

      <div class="page-zone page-zone-left" id="leftPage" aria-live="polite"></div>
      <div class="page-zone page-zone-right" id="rightPage" aria-live="polite"></div>

      <div class="turn-sheet turn-sheet-right" id="turnSheetRight" aria-hidden="true">
        <div class="sheet-face sheet-front" id="turnFrontRight"></div>
        <div class="sheet-face sheet-back" id="turnBackRight"></div>
      </div>

      <div class="turn-sheet turn-sheet-left" id="turnSheetLeft" aria-hidden="true">
        <div class="sheet-face sheet-front" id="turnFrontLeft"></div>
        <div class="sheet-face sheet-back" id="turnBackLeft"></div>
      </div>
    </section>

    <nav class="controls" aria-label="Гортання книги">
      <button id="prevBtn" type="button">← Назад</button>
      <span id="spreadIndicator">1 / 4</span>
      <button id="nextBtn" type="button">Далі →</button>
    </nav>
  </main>

  <template id="page-1">
    <article class="page-content first-page">
      <div class="story-title">Таємниця старої мапи</div>

      <div class="story-copy">
        <p>Одного сонячного дня Сашко й Дмитро гуляли біля річки. Під корінням старої верби Сашко помітив пожовклий згорток.</p>
        <p>Хлопці обережно розгорнули його — це була стара мапа. На ній виднілися річка, старий міст і стежка, що вела до невідомого яру.</p>
        <p class="dialogue">— Перевіримо, куди вона веде? — запропонував Дмитро.</p>
      </div>

      <figure class="illustration-inset illustration-bottom">
        <img src="05_scene_01_map_found.png" alt="Сашко й Дмитро розглядають знайдену мапу">
      </figure>
    </article>
  </template>

  <template id="page-2">
    <article class="page-content flowing-page">
      <div class="story-copy">
        <p>Біля берега стояв дерев’яний човен. Друзі сіли в нього й попливли за маршрутом, позначеним на мапі.</p>
        <p>Спочатку річка була широкою і спокійною. Та невдовзі береги стали вищими, дерева схилилися над водою, а попереду між скелями відкрився вузький прохід.</p>
        <p>Один із хлопців веслував, другий стежив за напрямком. Стара мапа лежала поруч, а човен усе далі віддалявся від знайомого берега.</p>
      </div>

      <figure class="illustration-inset illustration-bottom short-inset">
        <img src="06_scene_02_boat_route.png" alt="Хлопці пливуть човном за маршрутом">
      </figure>
    </article>
  </template>

  <template id="page-3">
    <article class="page-content image-led-page">
      <figure class="illustration-full">
        <img src="06_scene_02_boat_route.png" alt="Подорож човном крізь ущелину">
      </figure>
      <div class="image-caption">
        Річка вела їх туди, де починалася зовсім інша частина пригоди.
      </div>
    </article>
  </template>

  <template id="page-4">
    <article class="page-content flowing-page">
      <div class="story-copy">
        <p>Незабаром хлопці пристали до берега, витягли човен на сушу й рушили стежкою крізь густі хащі.</p>
        <p>Коріння дерев перепліталося з камінням. Було тихо, лише десь унизу ще чулося дзюрчання води.</p>
        <p>Стежка підіймалася вгору. За заростями раптом з’явився величезний дуб.</p>
      </div>

      <figure class="illustration-inset illustration-bottom">
        <img src="07_scene_03_ravine_arrival.png" alt="Хлопці прибули до занедбаного яру">
      </figure>
    </article>
  </template>

  <template id="page-5">
    <article class="page-content image-led-page">
      <figure class="illustration-full">
        <img src="08_scene_04_old_oak.png" alt="Хлопці бачать старий дуб">
      </figure>
      <div class="image-caption">
        Дуб ріс тут, мабуть, не одну сотню років.
      </div>
    </article>
  </template>

  <template id="page-6">
    <article class="page-content flowing-page">
      <div class="story-copy">
        <p>Та радість від знахідки швидко змінилася тривогою. Частина гілок була сухою, листя стало рідким, а кора подекуди потріскалася.</p>
        <p class="dialogue">— Мабуть, йому бракує води, — задумався Сашко.</p>
        <p>Дмитро згадав мапу. Неподалік від дуба на ній була позначка джерела. Хлопці почали спускатися між камінням і корінням, шукаючи воду.</p>
      </div>

      <figure class="illustration-inset illustration-bottom">
        <img src="09_scene_05_oak_problem.png" alt="Хлопці оглядають пошкоджений дуб">
      </figure>
    </article>
  </template>

  <template id="page-7">
    <article class="page-content image-led-page">
      <figure class="illustration-full">
        <img src="11_scene_07_spring_blocked.png" alt="Засмічене джерело">
      </figure>
      <div class="image-caption caption-large">
        Русло було завалене сухими гілками, листям і сміттям. Тепер хлопці зрозуміли, чому вода майже не доходила до коріння старого дуба.
      </div>
    </article>
  </template>

  <script src="assets/js/script.js"></script>
</body>
</html>
